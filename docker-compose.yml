services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
      target: dev
    container_name: water_quality_web_dev
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "8551:3000"
    environment:
      DATABASE_URL: ${DATABASE_URL_DOCKER:-mysql://root:rootpassword@mysql:3306/water_quality}
      NEXT_PUBLIC_LIFF_ID: ${NEXT_PUBLIC_LIFF_ID:-}
      TMD_API_TOKEN: ${TMD_API_TOKEN:-}
      CRON_SECRET: ${CRON_SECRET:-}
      WATCHPACK_POLLING: "true"
    depends_on:
      mysql:
        condition: service_healthy
    volumes:
      - .:/app
      - web_node_modules:/app/node_modules
      - web_next:/app/.next
    command: sh -c "npx prisma generate && npx prisma db push && npm run dev -- --hostname 0.0.0.0"

volumes:
  mysql_data:
    driver: local
  web_node_modules:
  web_next:
